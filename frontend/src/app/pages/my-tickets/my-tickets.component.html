<ion-header>
  <ion-toolbar><ion-title>My Tickets</ion-title></ion-toolbar>
</ion-header>

<ion-content class="ion-padding has-tab-bar">
  <div *ngIf="loading" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <div class="ticket-stub" *ngFor="let ticket of tickets">
    <div class="stub-top">
      <span class="ticket-type-pill">{{ ticket.ticket_type.name }}</span>
      <h3>{{ ticket.event.name }}</h3>
      <p><ion-icon name="calendar-outline"></ion-icon> {{ formatDate(ticket.event.start_date) }} · {{ ticket.event.start_time }}</p>
    </div>

    <div class="stub-perforation"></div>

    <div class="stub-bottom">
      <img *ngIf="qrImages[ticket.id]" [src]="qrImages[ticket.id]" alt="QR Code" />
      <p class="ticket-code">{{ ticket.ticket_code }}</p>
      <ion-badge [color]="statusColor(ticket.status)">{{ ticket.status }}</ion-badge>
    </div>
  </div>

  <p *ngIf="!loading && tickets.length === 0" class="empty-state">You don't have any tickets yet.</p>
</ion-content>
<app-tab-bar [tabs]="tabs"></app-tab-bar>
