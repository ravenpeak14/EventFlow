<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/organizer/events"></ion-back-button>
    </ion-buttons>
    <ion-title>Create Event</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Category</ion-label>
      <ion-select formControlName="event_category_id" interface="popover">
        <ion-select-option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Event Name</ion-label>
      <ion-input formControlName="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Description</ion-label>
      <ion-textarea formControlName="description" rows="4"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Start Date</ion-label>
      <ion-input type="date" formControlName="start_date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">End Date</ion-label>
      <ion-input type="date" formControlName="end_date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Start Time</ion-label>
      <ion-input type="time" formControlName="start_time"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">End Time</ion-label>
      <ion-input type="time" formControlName="end_time"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Capacity (optional)</ion-label>
      <ion-input type="number" formControlName="capacity"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="submitting">
      {{ submitting ? 'Creating...' : 'Create Event' }}
    </ion-button>

    <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
  </form>
</ion-content>
