<ion-header>
  <ion-toolbar>
    <ion-title>My Events</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>

  <ion-list *ngIf="!loading && events.length > 0">
    <ion-item *ngFor="let event of events" [routerLink]="['/organizer/events', event.id]" button>
      <ion-label>
        <h2>{{ event.name }}</h2>
        <p>{{ event.start_date }} · {{ event.category?.name }}</p>
      </ion-label>
      <ion-badge [color]="statusColor(event.status)">
        {{ event.status }}
      </ion-badge>
    </ion-item>
  </ion-list>

  <p *ngIf="!loading && events.length === 0" class="ion-text-center">
    No events yet.
  </p>
</ion-content>
