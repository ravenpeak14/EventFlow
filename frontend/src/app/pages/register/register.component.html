<ion-content class="auth-page" [fullscreen]="true">
  <div class="auth-wrapper">
    <div class="brand">
      <h1>Event<span>Flow</span></h1>
    </div>

    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Join EventFlow to start booking events</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <ion-input
        label="Full Name"
        labelPlacement="stacked"
        fill="outline"
        formControlName="name"
        placeholder="John Doe"
        class="auth-input"
      ></ion-input>

      <ion-input
        label="Email"
        labelPlacement="stacked"
        fill="outline"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        class="auth-input"
      ></ion-input>

      <ion-input
        label="Password"
        labelPlacement="stacked"
        fill="outline"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        placeholder="Min. 8 characters"
        class="auth-input"
      >
        <ion-icon
          slot="end"
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          (click)="showPassword = !showPassword"
        ></ion-icon>
      </ion-input>

      <ion-input
        label="Confirm Password"
        labelPlacement="stacked"
        fill="outline"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password_confirmation"
        placeholder="Re-enter password"
        class="auth-input"
      ></ion-input>

      <ion-button expand="block" type="submit" [disabled]="submitting" class="auth-submit">
        {{ submitting ? 'Creating account...' : 'Create Account' }}
      </ion-button>

      <p *ngIf="errorMessage" class="auth-error">{{ errorMessage }}</p>
    </form>

    <div class="auth-switch">
      <span>Already have an account?</span>
      <a routerLink="/login">Log in</a>
    </div>
  </div>
</ion-content>
