<ion-header>
  <ion-toolbar>
    <ion-title>Staff Check-in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding has-tab-bar">
  <ion-select label="Event" labelPlacement="stacked" [(ngModel)]="selectedEventId" interface="popover">
    <ion-select-option *ngFor="let event of events" [value]="event.id">{{ event.name }}</ion-select-option>
  </ion-select>

  <div class="field-box">
    <ion-input label="Ticket Code" labelPlacement="stacked" [(ngModel)]="ticketCode" placeholder="TIX-XXXXXXXXXX"
      (keyup.enter)="submit()"></ion-input>
  </div>

  <ion-button expand="block" [disabled]="!selectedEventId || !ticketCode.trim() || submitting" (click)="submit()">
    {{ submitting ? 'Checking...' : 'Check In' }}
  </ion-button>

  <h2 class="section-title">Recent Scans</h2>

  <div class="scan-entry" *ngFor="let entry of log" [class.success]="entry.success" [class.fail]="!entry.success">
    <ion-icon [name]="entry.success ? 'checkmark-circle' : 'close-circle'"></ion-icon>
    <div>
      <h3>{{ entry.ticketCode }}</h3>
      <p *ngIf="entry.success">{{ entry.attendeeName }} · {{ entry.ticketType }}</p>
      <p>{{ entry.message }}</p>
    </div>
  </div>
  <app-tab-bar [tabs]="tabs"></app-tab-bar>
</ion-content>
